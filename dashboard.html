<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeBlooded | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Top Navbar -->
  <header class="bg-white shadow-md px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">CodeBlooded Dashboard</h1>
    </div>

    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl">
      Logout
    </button>
  </header>

  <!-- Main Content -->
  <main class="p-6">
    
    <!-- Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      
      <div class="bg-red-50 rounded-2xl shadow p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold text-gray-700">Users</h2>
          <i data-lucide="users" class="w-6 h-6 text-blue-500"></i>
        </div>
        <p class="text-3xl font-bold text-gray-800">#</p>
        <p class="text-sm text-gray-500 mt-2">Friends</p>
      </div>

      <div class="bg-red-50 rounded-2xl shadow p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold text-gray-700">Something to do with One Piece</h2>
          <i data-lucide="folder" class="w-6 h-6 text-green-500"></i>
        </div>
        <p class="text-3xl font-bold text-gray-800">#</p>
        <p class="text-sm text-gray-500 mt-2">Characters</p>
      </div>

      <div class="bg-red-50 rounded-2xl shadow p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold text-gray-700">Messages</h2>
          <i data-lucide="mail" class="w-6 h-6 text-purple-500"></i>
        </div>
        <p class="text-3xl font-bold text-gray-800">#</p>
        <p class="text-sm text-gray-500 mt-2">Unread messages</p>
      </div>

    </section>

    <!-- Recent Activity -->
    <section class="bg-white rounded-2xl shadow p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Recent Activity</h2>

      <ul class="space-y-4">
    
        <li class="border-b pb-3">
          <p class="font-medium text-gray-700">Search Character</p>
        </li>

        <li class="pb-3">
          <p class="font-medium text-gray-700">Saved Characters</p>
        </li>
      </ul>
    </section>

  </main>

  <script>
    lucide.createIcons();

    document.getElementById("logoutBtn").addEventListener("click", () => {
      alert("Logged out");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
