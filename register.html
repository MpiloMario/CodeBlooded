<!DOCTYPE html>
<html>
<head>
<title>One Piece | Register</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="bg-red-50 min-h-screen grid place-items-center p-4">

<main class="w-full max-w-md">
<section class="bg-white rounded-3xl shadow-2xl p-6 space-y-5 border border-gray-200">

<h1 class="text-2xl font-semibold text-center">
Create Account
</h1>

<!-- Social Login -->
<section class="grid grid-cols-3 gap-3">

<button type="button" id="google"
class="border rounded-lg p-4 hover:bg-gray-100 transition space-y-2">
<img src="https://www.google.com/favicon.ico" class="w-5 h-5 mx-auto">
<span class="block text-sm">Google</span>
</button>

<button type="button" id="apple"
class="border rounded-lg p-4 hover:bg-gray-100 transition space-y-2">
<svg class="w-5 h-5 mx-auto" fill="black" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-2.06 1.25-1.7 4.62.22 5.52-.53 1.52-1.24 3.03-2.27 4.69zM12.03 7.25c-.15-2.35 1.66-4.35 3.84-4.65.29 2.32-2.14 4.48-3.84 4.65z"/>
</svg>
<span class="block text-sm">Apple</span>
</button>

<button type="button" id="microsoft"
class="border rounded-lg p-4 hover:bg-gray-100 transition space-y-2">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"
class="w-5 h-5 mx-auto">
<span class="block text-sm">Microsoft</span>
</button>

</section>

<section class="grid grid-cols-2 gap-3">

<button type="button" id="facebook"
class="border rounded-lg p-4 hover:bg-gray-100 transition space-y-2">
<svg class="w-5 h-5 mx-auto" fill="#1877F2" viewBox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
</svg>
<span class="block text-sm">Facebook</span>
</button>

<button type="button" id="twitter"
class="border rounded-lg p-4 hover:bg-gray-100 transition space-y-2">
<svg class="w-5 h-5 mx-auto" fill="#1DA1F2" viewBox="0 0 24 24">
<path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
</svg>
<span class="block text-sm">Twitter</span>
</button>

</section>

<!-- Divider -->
<section class="flex items-center gap-3 text-gray-400 text-sm">
<hr class="flex-1">
<span class="px-2 text-gray-500">or continue with</span>
<hr class="flex-1">
</section>

<!-- Login Form -->
<form id="loginForm" class="space-y-4">

<section class="space-y-2">
<label class="block text-sm font-medium text-gray-700">
Username
</label>
<section class="relative">
<i data-lucide="user"
class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>

<input type="text"
id="username"
required
placeholder="johndoe"
class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
</section>
<p class="text-xs text-gray-500">This will be your public display name</p>

</section>
<section class="space-y-2">
<label class="block text-sm font-medium text-gray-700">
Email Address
</label>

<section class="relative">
<i data-lucide="mail"
class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>

<input type="email"
id="email"
required
placeholder="name@example.com"
class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
</section>
</section>

<section class="space-y-2">
<label class="block text-sm font-medium text-gray-700">
Password
</label>

<section class="relative">
<i data-lucide="lock"
class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>

<input type="password"
id="password"
required
class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">

<button type="button"
onclick="togglePassword('password','eyeIcon')"
class="absolute right-3 top-3">
<i data-lucide="eye" id="eyeIcon"
class="h-5 w-5 text-gray-400"></i>
</button>

</section>
</section>

<section class="flex items-center justify-between text-sm">
<label class="flex items-center gap-2 cursor-pointer">
<input type="checkbox" class="rounded">
Remember me
</label>

<a href="#" class="text-blue-600 hover:underline">
Forgot password?
</a>
</section>

<button type="submit"
id="RegisterBtn"
class="w-full py-3 rounded-xl text-white font-medium
bg-gradient-to-r from-blue-600 to-purple-600
hover:from-blue-700 hover:to-purple-700
transition">
Create Account
</button>

</form>

<section class="text-center text-sm text-gray-600">
Already have an account?
<a href="login.html"
class="text-blue-600 font-medium hover:underline">
Sign in here
</a>
</section>

</section>
</main>

<script>
lucide.createIcons();
</script>

<script type="module" src="database.js"></script>

</body>
</html>
